<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>项目详情</title>
<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}
body{
  min-height:100vh;
  background:#080818;
  overflow:hidden;
  position:relative;
}
/* 返回首页按钮 */
.back-home{
  position:absolute;
  top:24px;
  left:24px;
  z-index:100;
  color:#fff;
  text-decoration:none;
  padding:8px 16px;
  border:1px solid #fff6;
  border-radius:6px;
}
.back-home:hover{
  background:#ffffff22;
}
/* 星星样式：胖五角星，指甲盖大小 */
.star{
  position:absolute;
  width:24px;
  height:24px;
  /* 绘制五角星，偏胖可爱 */
  clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
  background:#888899;
  cursor:pointer;
  transition: all 0.3s ease;
}
/* 点击后变黄变亮 */
.star.active{
  background:#ffdd22;
  box-shadow:0 0 16px #ffdd22;
}
/* 中间黄色桂树 */
.tree{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:160px;
  height:220px;
}
.tree-trunk{
  position:absolute;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:22px;
  height:80px;
  background:#704828;
  border-radius:4px;
}
.tree-leaf{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  width:140px;
  height:140px;
  background:#ffdd22;
  border-radius:50%;
  box-shadow:0 0 30px #ffdd2288;
}
</style>
</head>
<body>
<a href="index.html" class="back-home">返回首页</a>

<!-- 中间桂树 -->
<div class="tree">
  <div class="tree-leaf"></div>
  <div class="tree-trunk"></div>
</div>

<script>
// 生成30颗灰色胖五角星星星
const count = 30;
const body = document.body;
for(let i=0;i<count;i++){
  const star = document.createElement('div');
  star.className = "star";
  // 随机位置
  const x = Math.random() * (window.innerWidth - 30);
  const y = Math.random() * (window.innerHeight - 30);
  star.style.left = x + "px";
  star.style.top = y + "px";
  // 点击切换黄色高亮
  star.onclick = function(){
    this.classList.toggle("active");
  }
  body.appendChild(star);
}
</script>
</body>
</html>
