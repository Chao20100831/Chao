<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>麓光队 · 长白山宝马小学助学项目</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23c8903f'/%3E%3Ccircle cx='32' cy='32' r='14' fill='white'/%3E%3Cpath d='M32 22l3.1 6.3 6.9 1-5 4.9 1.2 6.9L32 37.6l-6.2 3.5 1.2-6.9-5-4.9 6.9-1z' fill='%23c8903f'/%3E%3C/svg%3E">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  font-family:"Microsoft YaHei","PingFang SC","Helvetica Neue",sans-serif;
  color:#1a1a1a;
}
.screen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}
/* 第一屏：纯背景 */
.screen-1{
  background: url('images/bg.jpg');
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
}

}
/* 第二屏：左图右文 */
.screen-2{background:#ffffff;padding:8vh 6vw;}
.s2-inner{display:flex;align-items:center;gap:6vw;max-width:1180px;width:100%;margin:0 auto;}
.s2-left{flex:1 1 48%;min-width:0;}
.s2-left img{width:100%;height:auto;display:block;border-radius:14px;box-shadow:0 18px 40px rgba(0,0,0,.12);object-fit:cover;}
.s2-right{flex:1 1 52%;min-width:0;}
.s2-right p{font-size:17px;line-height:1.95;letter-spacing:.02em;color:#1a1a1a;margin-bottom:1.6em;max-width:34em;}
.s2-right p:last-child{margin-bottom:0;}
/* 第三屏：麓光主题 */
.screen-3{background:#fbf8f1;padding:9vh 6vw;}
.s3-inner{max-width:880px;width:100%;margin:0 auto;text-align:center;}
.s3-title{font-size:34px;font-weight:700;color:#222;line-height:1.5;margin-bottom:1.1em;letter-spacing:.04em;}
.s3-title .accent{color:#c8903f;}
.s3-sub{font-size:16px;line-height:1.9;color:#3a3a3a;max-width:34em;margin:0 auto 3.2em;letter-spacing:.02em;}
.s3-figure{margin:0 auto;max-width:640px;}
.s3-figure img{width:100%;height:auto;display:block;border-radius:14px;box-shadow:0 16px 38px rgba(0,0,0,.12);object-fit:cover;}
@media (max-width:820px){
  .s2-inner{flex-direction:column;gap:4vh;}
  .s3-title{font-size:26px;}
}
</style>
</head>
<body>

<!-- 第一屏：纯背景 -->
<section class="screen screen-1" id="p1"></section>

<!-- 第二屏：左图 + 右文字 -->
<section class="screen screen-2" id="p2">
  <div class="s2-inner">
    <div class="s2-left">
      <img src="images/school.jpg" alt="宝马小学">
    </div>
    <div class="s2-right">
      <p>宝马小学坐落在长白山北麓、二道白河镇红丰村，被茫茫林海环抱。这里的孩子们生于长白山间，眼里藏着山林与星空，却受地域条件限制，课外读物、科普教具、兴趣课程资源相对有限。很多孩子对山外的世界充满好奇，却缺少拓展视野的机会。</p>
      <p>相隔数千公里，麓光队希望搭建起一座跨越山海的桥梁：把南方少年的善意送到长白山脚下，陪伴山里的孩子探索知识、看见更广阔的世界。</p>
    </div>
  </div>
</section>

<!-- 第三屏：麓光主题 -->
<section class="screen screen-3" id="p3">
  <div class="s3-inner">
    <h2 class="s3-title">麓光 <span class="accent">—— 取自山麓的微光。</span><br>长白山山麓的星光虽微弱，汇聚在一起，就能照亮山区孩子的求学路。</h2>
    <p class="s3-sub">我们是麓光队，来自广东碧桂园国际学校。本次公益助学项目，帮扶的学校是吉林省长白山保护开发区池北区二道白河镇红丰村宝马小学。</p>
    <figure class="s3-figure">
      <img src="images/team.jpg" alt="麓光队">
    </figure>
  </div>
</section>

</body>
</html>
