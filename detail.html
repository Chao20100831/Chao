<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>项目详情</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      min-height: 100vh;
      overflow: hidden;
      background: linear-gradient(#0b1026, #1a1f3a, #242854);
      font-family: "Microsoft YaHei", sans-serif;
      color: #fff;
      position: relative;
    }

    /* 星空画布 */
    #starrySky {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      display: block;
    }

    /* 返回按钮 */
    .back-btn {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 10;
      padding: 10px 18px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 30px;
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      backdrop-filter: blur(6px);
      cursor: pointer;
    }

    .back-btn:hover {
      background: rgba(255, 255, 255, 0.18);
    }

    /* 详情内容 */
    .detail-content {
      position: relative;
      z-index: 5;
      padding: 80px 20px 40px;
      max-width: 900px;
      margin: 0 auto;
      text-align: center;
    }

    .detail-content h1 {
      font-size: 36px;
      margin-bottom: 20px;
      letter-spacing: 2px;
    }

    .detail-content p {
      font-size: 16px;
      line-height: 1.8;
      color: #cfd6ff;
      margin-bottom: 16px;
    }

    .tip {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      font-size: 13px;
      color: #9aa7d6;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <canvas id="starrySky"></canvas>

  <a class="back-btn" href="index.html">← 返回首页</a>

  <div class="detail-content">
    <h1>项目详情</h1>
    <p>这里可以展示项目背景、目标、团队介绍、未来规划等详细内容。</p>
    <p>星空背景会随鼠标点击产生互动：点击灰色星星，它会变黄变亮，并带动周围星光轻微闪烁。</p>
  </div>

  <div class="tip">点击星星，让它变黄发亮</div>

  <script>
    const canvas = document.getElementById("starrySky");
    const ctx = canvas.getContext("2d");

    let stars = [];
    let width, height;

    // 调整画布尺寸
    function resizeCanvas() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      createStars();
    }

    // 创建星星
    function createStars() {
      stars = [];

      // 星星数量，根据屏幕大小自适应
      const count = Math.floor((width * height) / 14000);

      for (let i = 0; i < count; i++) {
        stars.push({
          x: Math.random() * width,
          y: Math.random() * height,
          r: Math.random() * 1.4 + 0.4,   // 星星半径
          baseR: Math.random() * 1.4 + 0.4,
          gray: "#7a84a8",                 // 灰色星星
          yellow: "#ffd84d",               // 黄色亮星
          brightness: 0,                   // 0 = 灰, 1 = 全黄
          twinkle: Math.random() * 0.02,
          speed: Math.random() * 0.015 + 0.005
        });
      }
    }

    // 绘制星星
    function drawStars() {
      ctx.clearRect(0, 0, width, height);

      for (let i = 0; i < stars.length; i++) {
        const s = stars[i];

        // 轻微呼吸闪烁
        s.twinkle += s.speed;
        const breath = Math.sin(s.twinkle) * 0.08;

        // 颜色渐变：灰色 -> 黄色
        const color = lerpColor(s.gray, s.yellow, s.brightness + breath);

        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r * (0.85 + s.brightness * 0.35), 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.shadowBlur = s.brightness * 12;
        ctx.shadowColor = s.yellow;
        ctx.fill();
      }

      requestAnimationFrame(drawStars);
    }

    // 颜色插值：从灰色过渡到黄色
    function lerpColor(color1, color2, t) {
      t = Math.max(0, Math.min(1, t));

      const c1 = hexToRgb(color1);
      const c2 = hexToRgb(color2);

      const r = Math.round(c1.r + (c2.r - c1.r) * t);
      const g = Math.round(c1.g + (c2.g - c1.g) * t);
      const b = Math.round(c1.b + (c2.b - c1.b) * t);

      return `rgb(${r}, ${g}, ${b})`;
    }

    function hexToRgb(hex) {
      const num = parseInt(hex.replace("#", ""), 16);
      return {
        r: (num >> 16) & 255,
        g: (num >> 8) & 255,
        b: num & 255
      };
    }

    // 鼠标点击检测
    canvas.addEventListener("click", function (e) {
      const mx = e.clientX;
      const my = e.clientY;

      for (let i = 0; i < stars.length; i++) {
        const s = stars[i];
        const dx = mx - s.x;
        const dy = my - s.y;
        const dist = Math.sqrt(dx * dx + dy * dy);

        // 点击范围：星星本身 + 周围一点
        if (dist < 18) {
          s.brightness = 1;

          // 点击后慢慢暗回去，也可以改成一直亮着
          setTimeout(() => {
            fadeOut(s);
          }, 1200);
        }
      }
    });

    // 慢慢变回灰色
    function fadeOut(star) {
      const timer = setInterval(() => {
        star.brightness -= 0.04;
        if (star.brightness <= 0) {
          star.brightness = 0;
          clearInterval(timer);
        }
      }, 40);
    }

    // 初始化
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();
    drawStars();
  </script>

</body>
</html>
